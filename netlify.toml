[build]
  publish = "."

[functions]
  directory = "api"
  # Teach Munni's judge reads its own copy of the built-in points (a phone
  # can't put words in the prompt); without this file a Munni's-sum point
  # can't be judged on Netlify
  included_files = ["src/content/teach.js"]

[[redirects]]
  from = "/api/ask"
  to = "/.netlify/functions/ask"
  status = 200

[[redirects]]
  from = "/api/class-sync"
  to = "/.netlify/functions/class-sync"
  status = 200

[[redirects]]
  from = "/api/syllabus"
  to = "/.netlify/functions/syllabus"
  status = 200

[[redirects]]
  from = "/api/teachback"
  to = "/.netlify/functions/teachback"
  status = 200
